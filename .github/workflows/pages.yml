name: Deploy public website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build public files only
        shell: pwsh
        run: ./tools/build-public-site.ps1
      - name: Verify public pages and links
        shell: pwsh
        run: ./tools/verify-launch-audit.ps1 -Public .release/public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .release/public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
